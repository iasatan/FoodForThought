<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mai étel – FoodForThought</title>
  <meta name="theme-color" content="#464feb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="index.css" />
</head>
<body>

<header>
  <h1>🥗 FoodForThought</h1>
  <nav>
    <a href="shopping.html">Bevásárlólista</a>
  </nav>
</header>

<main>
  <div class="meal-type-toggle">
    <button id="btn-lunch" onclick="setType('lunch')">&#127869; Ebéd</button>
    <button id="btn-breakfast" onclick="setType('breakfast')">&#127774; Reggeli / Vacsora</button>
  </div>
  <form class="ingredient-filters" onsubmit="return false">
    <label>
      <span>Legyen benne mind</span>
      <input id="include-all-ingredients" type="search" placeholder="pl. gomba, rizs" autocomplete="off" />
    </label>
    <label>
      <span>Legyen benne legalább egy</span>
      <input id="include-any-ingredients" type="search" placeholder="pl. csirke, tofu" autocomplete="off" />
    </label>
    <label>
      <span>Ne legyen benne</span>
      <input id="exclude-ingredient" type="search" placeholder="pl. vegán tejföl, vegán sajt" autocomplete="off" />
    </label>
    
  </form>
  <div class="day-nav">
    <button class="day-nav-btn" id="btn-prev" onclick="stepDay(-1)">&#8249;</button>
    <span class="day-nav-label today" id="day-label">Ma</span>
    <button class="day-nav-btn" id="btn-next" onclick="stepDay(1)">&#8250;</button>
  </div>
  <div id="app"></div>
</main>

<script src="foods-data.js"></script>
<script src="breakfast-data.js"></script>
<script src="index.js"></script>
</body>
</html>
